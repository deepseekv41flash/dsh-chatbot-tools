# dsh-chatbot-tools — bundle patch 层。
# 有这一层，插件才有「包身份」：会出现在 设置 → 插件 列表里，可被插件管理器
# 识别、启停与升级；只靠运行时 loader.create 注入的匿名 entry 不会出现在那里。
- insert:
    - id: dsh-chatbot-tools
      name: 'dsh-chatbot-tools'
      inject:
        - tools
      config:
        # 内容安全与拒答提示**都默认关闭**：它们会限制 DSH 本身的能力
        # （内容审核会拒掉网安红队/渗透测试这类正常需求），所以开关交给用户。
        safetyEnabled: false
        safetyMode: enforce
        safetyLevel: high
        safetyGuardDeferLoading: true
        safetySkipPurposes:
          - title
          - session-title
        safetyLog: true
        refusalNotice: false
        model: deepseek-flash
        serverTool: deepseek_web_search
        maxUses: 1
